name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle from Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare Signing and Env Files
        run: |
          if [ ! -f .env.example ]; then touch .env.example; fi
          if [ ! -f .env ]; then cp .env.example .env; fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          cat gradle/wrapper/gradle-wrapper.properties || true
          if ! gradle assembleDebug --no-configuration-cache --no-daemon 2>&1 | tee build.log; then
            REQ_VER=$(grep -oP 'Minimum supported Gradle version is \K[0-9.]+' build.log | head -n 1 || true)
            if [ -n "$REQ_VER" ]; then
              echo " Auto-installing required Gradle version: $REQ_VER"
              curl -sL "https://services.gradle.org/distributions/gradle-${REQ_VER}-bin.zip" -o gradle.zip
              unzip -q gradle.zip -d /tmp/gradle-dist
              /tmp/gradle-dist/gradle-${REQ_VER}/bin/gradle assembleDebug --no-configuration-cache --no-daemon
            else
              exit 1
            fi
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CipherMesh-App
          path: app/build/outputs/apk/**/*.apk
